[package]
name = "armature-azure-functions"
version = "0.3.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-azure-functions"
homepage = "https://quinnjr.github.io/armature"
description = "Azure Functions runtime adapter for Armature applications"
keywords = ["azure", "functions", "serverless", "armature", "faas"]
categories = ["web-programming", "asynchronous"]

[dependencies]
# Armature core
armature-core = { version = "0" }

# Azure SDK (optional, for Azure service access)
armature-azure = { version = "0", optional = true }

# Async runtime
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "net", "time"] }
async-trait = "0.1"

# HTTP server for custom handler
hyper = { version = "1.10", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server"] }
http-body-util = "0.1"

# HTTP types
http = "1.4"
bytes = "1.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# URL encoding
urlencoding = "2.1"

# Base64 for binary responses
base64 = "0.22"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "test-util"] }

[features]
default = []
azure-services = ["armature-azure"]

